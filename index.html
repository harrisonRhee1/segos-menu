<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EE7023">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="구내식당">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>세고스 구내식당 메뉴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen phone app. Sticky top bar, home = two exact halves (today / week), detail views slide in. */
:root{
  --bg:#F2F2F1; --surface:#FFFFFF; --ink:#18221F; --muted:#62676B; --line:#DADCDD;
  --tray:#EE7023; --tray-ink:#FFFFFF; --rice:#1B1F22; --rice-ink:#FFFFFF; --warn:#B4442F;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1A1D20; --ink:#ECEEEF; --muted:#9EA4A8; --line:#2E3337;
  --tray:#F07A2E; --tray-ink:#1A0D03; --rice:#2B3135; --rice-ink:#F2F4F5; --warn:#E07A63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1A1D20; --ink:#ECEEEF; --muted:#9EA4A8; --line:#2E3337;
  --tray:#F07A2E; --tray-ink:#1A0D03; --rice:#2B3135; --rice-ink:#F2F4F5; --warn:#E07A63; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{height:30px;display:flex;align-items:center;flex:none}
.logo img{height:26px;width:auto}
.lg-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-l{display:none} :root:not([data-theme="light"]) .lg-d{display:block}}
:root[data-theme="dark"] .lg-l{display:none} :root[data-theme="dark"] .lg-d{display:block}
.wordmark{font-family:var(--display);font-size:20px;letter-spacing:.06em;color:var(--tray);border:2px solid var(--tray);border-radius:6px;padding:0 6px;line-height:26px}
header h1{font-family:var(--display);font-weight:400;font-size:21px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-size:14px;cursor:pointer}
.iconbtn:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--tray);outline-offset:2px}
main{min-height:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto}

/* Home: exact 50/50 split */
.home{display:grid;grid-template-rows:1fr 1fr;gap:0}
.half{appearance:none;border:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:4px;min-height:0;overflow:hidden;
  padding-block:20px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.half.today{background:var(--tray);color:var(--tray-ink)}
.half.week{background:var(--rice);color:var(--rice-ink)}
.half .fit{font-family:var(--display);font-weight:400;line-height:1.08;margin:0;white-space:nowrap;display:block;width:max-content;max-width:none;font-size:48px}
.half .fit.t{opacity:.9}
.half .note{font-size:14px;font-weight:500;opacity:.9;min-height:0}
.half .note:empty{display:none}
.half .arrow{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:14px;font-family:var(--display);font-size:26px;line-height:1;opacity:.75}
.half:active{filter:brightness(.95)}

/* Detail views */
.pad{padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.back{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.datehead{font-family:var(--display);font-size:30px;line-height:1.1;margin:0}
.datehead small{display:block;font-family:var(--body);font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--tray);color:var(--tray-ink)}
.ex{margin:0 0 12px;font-size:13px;color:var(--warn);font-weight:500}
.dayview{height:100%;display:flex;flex-direction:column}
.dayfill{flex:1;min-height:0;display:flex;flex-direction:column;padding-block:0 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.day{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.day .ex{margin:0}
.slots{flex:1;min-height:0;display:grid;grid-template-rows:repeat(var(--n,2),minmax(0,1fr));gap:10px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.slot h3{margin:0;display:flex;justify-content:center;align-items:baseline;gap:8px;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.15;color:var(--tray)}
.slot h3 span{font-family:var(--body);font-size:13px;color:var(--muted)}
.slot ul{flex:1 1 0;min-height:0;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;overflow:hidden}
.slot li{white-space:nowrap;width:max-content;max-width:none;line-height:1.25;font-size:20px;text-align:center}
.slot li:first-child{font-weight:600}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.meal h3{margin:0 0 8px;display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:400;font-size:22px;color:var(--tray)}
.meal h3 span{font-family:var(--body);font-size:12px;color:var(--muted)}
.meal ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.meal li{font-size:17px}
.meal li:first-child{font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px 16px;color:var(--muted);text-align:center}

/* Week: book-like horizontal pager */
.weekwrap{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;perspective:1200px}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;overflow:hidden;display:flex;flex-direction:column;transform-origin:left center;transition:transform .25s ease, opacity .25s ease}
.dots{display:flex;justify-content:center;gap:8px;padding-block:10px 14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot[aria-current="true"]{background:var(--tray);width:22px;border-radius:4px}
.navrow{display:flex;gap:8px}
@media (prefers-reduced-motion: reduce){.page{transition:none}}

/* Admin sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet .box{background:var(--surface);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 4px}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:14px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--tray);color:var(--tray-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:14px;margin:10px 0;min-height:1.4em}
.status.err{color:var(--warn)}
.prev{max-height:180px;border-radius:10px;border:1px solid var(--line);margin:8px 0}
.edit{display:grid;gap:12px;margin:12px 0}
.edit fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;min-width:0}
.edit legend{font-weight:600;padding:0 4px}
.edit label{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.edit textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);color:var(--ink);resize:vertical}
input[type=file]{font:inherit;max-width:100%}
</style>

</head>

    <h1>구내식당 메뉴표</h1>
  </header>
  <main>
    <section class="view home" id="home">
      <button class="half today" id="goToday">
        <span class="fit t">오늘의 메뉴</span><span class="fit" id="todayBig">--</span>
        <span class="note" id="todayPeek">메뉴를 불러오는 중입니다</span><span class="arrow" aria-hidden="true">→</span>
      </button>
      <button class="half week" id="goWeek">
        <span class="fit t">주간 메뉴</span><span class="fit" id="weekBig">--</span>
        <span class="note" id="weekPeek"></span><span class="arrow" aria-hidden="true">→</span>
      </button>
    </section>

    <section class="view" id="todayView" hidden>
      <div class="dayview">
        <div class="pad" style="padding-bottom:0"><div class="back"><button class="iconbtn" data-home>← 처음으로</button></div></div>
        <div class="dayfill" id="todayBody"></div>
      </div>
    </section>

    <section class="view" id="weekView" hidden>
      <div class="weekwrap">
        <div class="pad" style="padding-bottom:0">
          <div class="back"><button class="iconbtn" data-home>← 처음으로</button>
            <div class="navrow"><button class="iconbtn" id="prevPg" aria-label="이전 날">‹</button><button class="iconbtn" id="nextPg" aria-label="다음 날">›</button></div></div>
        </div>
        <div class="pager" id="pager"></div>
        <div class="dots" id="dots"></div>
      </div>
    </section>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">주간 메뉴표 올리기</h2>
    <p>그룹웨어에 올라온 메뉴표 사진을 선택하면 날짜별로 읽어서 채웁니다. 저장 전에 내용을 확인하고 고칠 수 있습니다.</p>
    <input type="file" id="file" accept="image/*">
    <img class="prev" id="prev" alt="선택한 메뉴표" hidden>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="readBtn" disabled>사진 읽기</button>
      <button class="btn ghost" id="closeSheet">닫기</button>
    </div>
    <div class="status" id="status"></div>
    <div class="edit" id="edit"></div>
    <div class="row" id="saveRow" hidden>
      <button class="btn" id="saveBtn">이 내용으로 저장</button>
      <button class="btn ghost" id="cancelEdit">다시 고르기</button>
    </div>
  </div>
</div>

<script>
const WD=["일","월","화","수","목","금","토"];
const $=id=>document.getElementById(id);
let days=[];           // [{date, meals:[{name,items,kcal}], example}]


function kstToday(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  return p; // YYYY-MM-DD
}
function parseD(s){const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d));}
function label(s){const d=parseD(s);return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일 (${WD[d.getUTCDay()]})`;}
function esc(t){return String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function slotsFor(day){
  const meals=(day&&day.meals)||[];
  const pick=re=>meals.find(m=>re.test(m.name));
  const lunch=pick(/중식|점심/), dinner=pick(/석식|저녁/);
  const rest=meals.filter(m=>m!==lunch&&m!==dinner);
  return [...rest.filter(m=>/조식|아침/.test(m.name)),{name:"중식",...(lunch||{}),name:"중식"},{name:"석식",...(dinner||{}),name:"석식"},...rest.filter(m=>!/조식|아침/.test(m.name))];
}
function dayBlock(day,isToday){
  const slots=slotsFor(day);
  return `<div class="day">
    <h2 class="datehead">${label(day.date)} ${isToday?'<span class="badge">오늘</span>':""}</h2>
    ${day.example?'<p class="ex">예시 데이터입니다. 실제 메뉴표 사진을 올리면 바뀝니다.</p>':""}
    <div class="slots" style="--n:${slots.length}">${slots.map(m=>`
      <article class="slot"><h3>${esc(m.name)}${m.kcal?`<span>${esc(m.kcal)} kcal</span>`:""}</h3>
      <ul>${(m.items||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></article>`).join("")}</div>
  </div>`;
}

function render(){
  const today=kstToday();
  const tDay=days.find(d=>d.date===today);
  const upcoming=days.filter(d=>d.date>=today);
  $("todayBig").textContent=label(today);
  $("todayPeek").textContent=tDay?"":(days.length?"오늘은 등록된 메뉴가 없습니다":"아직 올라온 메뉴표가 없습니다");
  const mon=new Date(parseD(today));mon.setUTCDate(mon.getUTCDate()-((mon.getUTCDay()+6)%7));
  const sun=new Date(mon);sun.setUTCDate(mon.getUTCDate()+6);
  const iso=d=>d.toISOString().slice(0,10);
  let wk=days.filter(d=>d.date>=iso(mon)&&d.date<=iso(sun));
  if(!wk.length) wk=upcoming;
  const short=s=>{const d=parseD(s);return `${d.getUTCMonth()+1}월 ${d.getUTCDate()}일`;};
  if(wk.length){$("weekBig").textContent=`${short(wk[0].date)} ~ ${short(wk[wk.length-1].date)}`;$("weekPeek").textContent="";}
  else {$("weekBig").textContent="이번 주";$("weekPeek").textContent="등록된 메뉴가 없습니다";}
  fitHome();

  // today view: always lunch + dinner, blank when there is no menu
  $("todayBody").innerHTML=dayBlock(tDay||{date:today,meals:[]},true);
  // week pager
  const list=upcoming.length?upcoming:[];
  $("pager").innerHTML=list.length?list.map(d=>`<div class="page"><div class="dayfill">${dayBlock(d,d.date===today)}</div></div>`).join("")
    :`<div class="page"><div class="dayfill">${dayBlock({date:today,meals:[]},true)}</div></div>`;
  $("dots").innerHTML=list.map((d,i)=>`<button class="dot" data-i="${i}" aria-label="${label(d.date)}"></button>`).join("");
  updateDots();
  requestAnimationFrame(fitDays);
}

// pager interactions: book-like tilt while swiping
function pages(){return [...$("pager").querySelectorAll(".page")];}
function current(){const p=$("pager");return Math.round(p.scrollLeft/Math.max(1,p.clientWidth));}
function updateDots(){
  const i=current();
  [...$("dots").children].forEach((d,k)=>d.setAttribute("aria-current",k===i?"true":"false"));
  const p=$("pager"),w=p.clientWidth||1;
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    pages().forEach((pg,k)=>{const off=(k*w-p.scrollLeft)/w;const r=Math.max(-1,Math.min(1,off));
      pg.style.transform=`rotateY(${-r*18}deg)`;pg.style.opacity=String(1-Math.abs(r)*.35);});
  }
}
function goPage(i){const p=$("pager");const n=pages().length;i=Math.max(0,Math.min(n-1,i));p.scrollTo({left:i*p.clientWidth,behavior:"smooth"});}
$("pager").addEventListener("scroll",()=>requestAnimationFrame(updateDots),{passive:true});
$("prevPg").onclick=()=>goPage(current()-1);
$("nextPg").onclick=()=>goPage(current()+1);
$("dots").onclick=e=>{const b=e.target.closest(".dot");if(b)goPage(+b.dataset.i);};
addEventListener("resize",updateDots);


// home: every line in both halves gets the same, largest size that fits
function fitHome(){
  const halves=[...document.querySelectorAll(".half")]; let size=Infinity;
  for(const h of halves){
    const cs=getComputedStyle(h),w=h.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-4;
    const H=h.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    if(!w||!H) return;
    const els=[...h.querySelectorAll(".fit")];
    for(const el of els){el.style.fontSize="100px";size=Math.min(size,100*w/Math.max(1,el.scrollWidth));}
    const note=h.querySelector(".note").offsetHeight;
    size=Math.min(size,(H-note-8)/(els.length*1.12));
  }
  document.querySelectorAll(".half .fit").forEach(el=>el.style.fontSize=Math.floor(size)+"px");
}
// day: lunch + dinner fill the screen; size assumes both are full (at least 6 lines each)
function fitDays(){
  document.querySelectorAll(".day").forEach(day=>{
    if(!day.clientHeight) return;
    const uls=[...day.querySelectorAll(".slot ul")];
    const rows=Math.max(6,...uls.map(u=>u.children.length));
    let size=Infinity;
    for(const u of uls){
      const H=u.clientHeight,W=u.clientWidth-4; if(!H||!W) continue;
      size=Math.min(size,H/(rows*1.32));
      for(const li of u.children){li.style.fontSize="100px";size=Math.min(size,100*W/Math.max(1,li.scrollWidth));}
    }
    if(!isFinite(size)) return;
    size=Math.max(14,Math.floor(size));
    uls.forEach(u=>[...u.children].forEach(li=>li.style.fontSize=size+"px"));
    day.querySelectorAll(".slot h3").forEach(h=>h.style.fontSize=Math.max(20,Math.round(size*.9))+"px");
  });
}
addEventListener("resize",fitDays);
document.fonts&&document.fonts.ready.then(fitDays);
addEventListener("resize",fitHome);
document.fonts&&document.fonts.ready.then(fitHome);

// routing
function show(){
  const h=location.hash.slice(1);
  $("home").hidden=!!(h==="today"||h==="week");
  $("todayView").hidden=h!=="today";
  $("weekView").hidden=h!=="week";
  if(h==="week"){$("pager").scrollLeft=0;requestAnimationFrame(updateDots);}
  if(!h) requestAnimationFrame(fitHome); else requestAnimationFrame(fitDays);
}
$("goToday").onclick=()=>{location.hash="today"};
$("goWeek").onclick=()=>{location.hash="week"};
document.querySelectorAll("[data-home]").forEach(b=>b.onclick=()=>{history.replaceState(null,"",location.pathname+location.search);show();});
addEventListener("hashchange",show);
show(); render();

// data: menu.json in this site
async function load(){
  try{
    const r=await fetch("menu.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw 0;
    const j=await r.json();
    days=(j.days||[]).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d.date)).sort((a,b)=>a.date<b.date?-1:1);
    render();
  }catch(e){ if(!days.length) $("todayPeek").textContent="메뉴를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."; }
}
load();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ load(); } });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
